name: Build & Release Android APK

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare APK Artifact
      run: |
        mkdir -p release_apk
        cp app/build/outputs/apk/debug/app-debug.apk release_apk/JNET-MONITOR-v3.0.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JNET-MONITOR-v3.0.0.apk
        path: release_apk/JNET-MONITOR-v3.0.0.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release_apk/JNET-MONITOR-v3.0.0.apk
        name: JNET-MONITOR-APK v3.0.0
        body: |
          ### 🚀 Pembaruan JNET-MONITOR-APK v3.0.0

          - 🖨️ **Fix Handler Download Aplikasi/Driver**: Menambahkan `DownloadListener` & `DownloadManager` native agar pengunduhan dari WebView dan menu Driver Printer berjalan langsung ke folder Downloads HP dengan notifikasi progress.
          - 🌐 **Deteksi Format Berkas Otomatis**: Pengunduhan berkas `.apk`, `.zip`, `.pdf`, `.rar` otomatis ditangani oleh sistem Android.
          - 🌗 **Pembaruan Stabilitas & Tema**: Performa navigasi browser lebih lancar dan responsif.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
